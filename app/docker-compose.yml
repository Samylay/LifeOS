services:
  app:
    build: .
    image: lifeos
    container_name: lifeos
    restart: unless-stopped
    # Bound to localhost; exposed to the tailnet over HTTPS via `tailscale serve`
    # (sudo tailscale serve --bg 3000 → https://homelab.tail069527.ts.net).
    # The app has no login, and `tailscale serve` only accepts tailnet traffic.
    ports:
      - "127.0.0.1:3000:3000"
      # Also bound to the tailscale IP (same pattern as n8n): phones on the
      # tailnet reach the app by raw IP (http://100.124.149.101:3000) with no
      # MagicDNS dependency — ts.net names are NOT in public DNS, and Samy's
      # phone runs with 'Use Tailscale DNS' off (carrier DNS conflict).
      - "100.124.149.101:3000:3000"
    env_file:
      - .env
    environment:
      # Local LLM via Ollama running on the homelab host (not in this container).
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:7b"
      LIFEOS_DB_PATH: "/data/lifeos.db"
      HERMES_STATUS: "/hermes/status.json"
      DOCKER_SOCK: "/var/run/docker.sock"
      # The Hermes-managed Obsidian vault, mounted read-write below so LifeOS
      # can browse/search notes and capture new ones (Hermes then enriches).
      KB_PATH: "/vault"
      # Notes LifeOS creates are chowned to this uid/gid so Hermes (host user)
      # can append its summary/tags. Match `id -u`/`id -g` of the vault owner.
      KB_UID: "1000"
      KB_GID: "1000"
      # LifeOS calls use the host's Codex CLI. Set GEN_PROVIDER=ollama
      # to use the local model directly instead.
      GEN_PROVIDER: "codex"
      CODEX_BRIDGE_URL: "http://host.docker.internal:11435/generate"
      # Read-only Crawl4AI PoC. Override CRAWL4AI_API_TOKEN in the deploy
      # environment for a non-default token; the service is not published.
      CRAWL4AI_URL: "http://crawl4ai:11235"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in the deploy environment}"
      # Prometheus (monitoring stack) for the /status host vitals — reached by
      # service name over the shared monitoring network (declared below).
      PROM_URL: "http://prometheus:9090"
      # Morning brief — built in-app (src/lib/brief, daily 06:00 BRIEF_TZ).
      # Todoist token + n8n webhook in .env.
      BRIEF_TZ: "Europe/Paris"
      FEED_RETIRED: "1"
      ABTEST_CONTENT_DIR: "/abtest-design"
      BRIEF_OUT: "/data/brief.json"
      OBJECTIVES_DIR: "/objectives"
      WHISPER_URL: "http://host.docker.internal:8091"
      # Pager tap deep-link origin (IP-based so taps work regardless of the
      # phone's DNS state). Kept for any future deep-link consumer.
      PAGER_CLICK_URL: "http://100.124.149.101:3000/pager"
      # Finance (Enable Banking, T67–T72): ENABLE_BANKING_APP_ID reaches the
      # container via env_file (.env) once Samy registers the app — no compose
      # change needed for the id itself. The private key is a FILE
      # (~/.config/homelab/enable-banking.pem, the only copy, never committed:
      # *.pem in .gitignore + enable-banking.pem in the global git ignore);
      # its transport into the container is undecided (MAP.md Q5: base64 in
      # .env vs a read-only volume mount). If Q5 lands on the mount, add
      #   - ~/.config/homelab/enable-banking.pem:/secrets/enable-banking.pem:ro
      # under volumes: in its own commit stating the operational effect.
    networks:
      - default
      - monitoring
    extra_hosts:
      # Lets the container reach the host's Ollama at host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      - lifeos-data:/data
      - ./data/abtest-design:/abtest-design:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/quorky/.hermes:/hermes:ro
      # Objectives rotation config+state (shared with host classify.py).
      - /home/quorky/services/objectives:/objectives
      - /home/quorky/vault/obsidian:/vault
      # T28: tracked-centres (daily-planning dynamic blocks) reads host-path
      # ROADMAP.md files + ~/infra/goals state; mounted read-only at the SAME
      # absolute paths so the module's host defaults work unchanged in-container.
      - /home/quorky/apps:/home/quorky/apps:ro
      - /home/quorky/infra:/home/quorky/infra:ro
      # Chat homelab bridge: get_autoloop_summary reads the nightly log.
      - /home/quorky/services/autoloop:/home/quorky/services/autoloop:ro
    depends_on:
      crawl4ai:
        condition: service_healthy

  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    container_name: lifeos-crawl4ai
    restart: unless-stopped
    shm_size: "1g"
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in the deploy environment}"
    expose:
      - "11235"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  lifeos-data:

networks:
  # Shared with the monitoring stack (~/infra/monitoring) so LifeOS can query
  # Prometheus by service name for the /status host vitals.
  monitoring:
    external: true
    name: monitoring_monitoring
  default:
